<script>window.ARC_CONFIG = {"api": "https://mib-arcade.terminalmib.workers.dev", "names": true, "sounds": false, "sfx": "sfx/", "music": false, "lan": true, "net": "auto", "pages": {"hub": "./", "strike": "strike.html", "empire": "empire.html"}};</script>

<script>
"use strict";
const cv = document.getElementById("c"), cx = cv.getContext("2d"), W = 480, H = 360, STEP = 1 / 60;
const screenEl = document.getElementById("screen"), focusEl = document.getElementById("focus");
cx.imageSmoothingEnabled = false; cx.setTransform(2, 0, 0, 2, 0, 0);
const rnd = (a, b) => a + Math.random() * (b - a), rint = (a, b) => Math.floor(rnd(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (xs) => xs[Math.floor(Math.random() * xs.length)];

const keys = new Set(), hit = new Set();
const GAME_KEYS = new Set(["KeyO", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Enter", "Slash", "KeyW", "KeyA", "KeyS", "KeyD", "KeyF", "KeyX", "KeyZ", "Escape", "KeyP", "KeyM",
  "Digit1", "Digit2", "Digit3", "Digit4", "Digit5", "Digit6", "Digit7", "Numpad1", "Numpad2", "Numpad3", "Numpad4", "Numpad5", "Numpad6", "Numpad7", "ShiftLeft", "ShiftRight"]);
addEventListener("keydown", (e) => {
  if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  if (!keys.has(e.code)) hit.add(e.code);
  keys.add(e.code);
  audioStart();
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("blur", () => keys.clear());
const held = (...c) => c.some((k) => keys.has(k)), pressed = (...c) => c.some((k) => hit.has(k));

let AC = null, master = null, sound = true;
try { sound = localStorage.getItem("arcade-sound") !== "off"; } catch (e) {}
function audioStart() {
  if (typeof inMenu !== "undefined" && inMenu && menuOwn && sound && menuAudio.paused) menuAudio.play().catch(() => {});
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = sound ? 0.5 : 0; master.connect(AC.destination); } catch (e) { AC = null; }
  if (song) music(cur ? cur.id : "menu");
}
function tone(freq, dur, type = "square", vol = 0.08, slide = 0, when = 0) {
  if (!AC || !sound) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.1, lp = 1800, when = 0) {
  if (!AC || !sound) return;
  const t = AC.currentTime + when, n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = "lowpass"; f.frequency.value = lp; s.buffer = b;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const SFX = {
  move: () => tone(220, 0.04, "square", 0.03), rot: () => tone(440, 0.05, "square", 0.04, 120), drop: () => tone(160, 0.1, "triangle", 0.12, -80),
  line: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, "square", 0.06, 0, i * 0.06)), shot: () => tone(880, 0.08, "square", 0.04, -500),
  boom: () => noise(0.35, 0.18, 900), coin: () => { tone(988, 0.06, "square", 0.05); tone(1319, 0.14, "square", 0.05, 0, 0.06); },
  jump: () => tone(330, 0.16, "square", 0.05, 330), stomp: () => tone(200, 0.12, "square", 0.08, -120), eat: () => tone(1200, 0.05, "square", 0.05),
  over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.2, "triangle", 0.1, 0, i * 0.16)), beep: () => tone(1000, 0.18, "square", 0.06),
  go: () => tone(1500, 0.5, "square", 0.07), bump: () => { noise(0.12, 0.15, 600); tone(110, 0.12, "sawtooth", 0.08, -40); },
  taiko: () => { tone(70, 0.3, "sine", 0.35, -25); noise(0.08, 0.12, 400); }, oof: () => { tone(180, 0.25, "sawtooth", 0.09, -110); noise(0.15, 0.12, 700); },
  crowd: () => { for (let i = 0; i < 6; i++) noise(0.5, 0.05, rnd(900, 2400), i * 0.07); }, win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.14, "square", 0.06, 0, i * 0.11)),
};
const NOTE = (n) => { if (n === "-") return 0; const m = /^([A-G])(#?)(\d)$/.exec(n), s = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 }[m[1]] + (m[2] ? 1 : 0) + (m[3] - 4) * 12; return 440 * Math.pow(2, s / 12); };
const SONGS = {
  blocks: { bpm: 150, type: "square", vol: 0.035, notes: "E5 1 B4 .5 C5 .5 D5 1 C5 .5 B4 .5 A4 1 A4 .5 C5 .5 E5 1 D5 .5 C5 .5 B4 1.5 C5 .5 D5 1 E5 1 C5 1 A4 1 A4 2 D5 1.5 F5 .5 A5 1 G5 .5 F5 .5 E5 1.5 C5 .5 E5 1 D5 .5 C5 .5 B4 1 B4 .5 C5 .5 D5 1 E5 1 C5 1 A4 1 A4 2" },
  rocks: { bpm: 132, type: "sawtooth", vol: 0.025, notes: "A2 .5 A2 .5 E3 .5 A2 .5 G2 .5 G2 .5 D3 .5 G2 .5 F2 .5 F2 .5 C3 .5 F2 .5 E2 .5 E2 .5 B2 .5 E3 .5" },
  jump: { bpm: 168, type: "square", vol: 0.03, notes: "C5 .5 E5 .5 G5 .5 E5 .5 F5 .5 A5 .5 G5 1 E5 .5 G5 .5 C6 .5 G5 .5 A5 .5 F5 .5 G5 1 D5 .5 F5 .5 A5 .5 F5 .5 E5 .5 G5 .5 C5 1" },
  sumo: { bpm: 110, type: "triangle", vol: 0.03, notes: "D4 1 - .5 F4 .5 G4 1 A4 1 C5 1.5 A4 .5 G4 1 - 1" },
};
const HARP = { Dm: "D4 F4 A4 D5 F5 A5 D6 F6", Bb: "A#3 D4 F4 A#4 D5 F5 A#5 D6", F: "F3 A3 C4 F4 A4 C5 F5 A5",
               C: "C4 E4 G4 C5 E5 G5 C6 E6", Gm: "G3 A#3 D4 G4 A#4 D5 G5 A#5", A: "A3 C#4 E4 A4 C#5 E5 A5 C#6" };
SONGS.menu = { voices: [
  { type: "triangle", vol: 0.07, ring: 0.65, unit: 0.105, notes: ["Dm", "Bb", "F", "C", "Dm", "Bb", "Gm", "A"]
      .map((c) => { const up = HARP[c].split(" "); return up.concat(up.slice().reverse()).map((n) => n + " 1").join(" "); }).join(" ") },
  { type: "triangle", vol: 0.08, ring: 1.7, unit: 0.105, notes: ["D2", "A#1", "F2", "C2", "D2", "A#1", "G1", "A1"].map((n) => n + " 16").join(" ") }] };
let song = null, tracks = [];
function music(id) {
  song = SONGS[id] || null;
  ownMenu(id === "menu");
  const t0 = AC ? AC.currentTime + 0.1 : 0;
  tracks = !song || (id === "menu" && menuOwn) ? [] : (song.voices || [{ type: song.type, vol: song.vol, unit: 60 / song.bpm, notes: song.notes }]).map((v) => {
    const seq = v.notes.trim().split(/\s+/), items = [];
    for (let i = 0; i < seq.length; i += 2) items.push([seq[i], parseFloat(seq[i + 1])]);
    return { v, items, i: 0, at: t0 };
  });
}
function musicPump() {
  if (!AC || !sound) return;
  for (const tr of tracks) {
    if (tr.at < AC.currentTime) tr.at = AC.currentTime + 0.05;
    while (tr.at < AC.currentTime + 0.3) {
      const [n, len] = tr.items[tr.i], d = len * tr.v.unit, f = NOTE(n);
      if (f) tone(f, tr.v.ring ? Math.max(d * 0.9, tr.v.ring) : d * 0.9, tr.v.type, tr.v.vol, 0, tr.at - AC.currentTime);
      tr.at += d; tr.i = (tr.i + 1) % tr.items.length;
    }
  }
}
const menuAudio = new Audio();
let menuOwn = false, inMenu = false;
menuAudio.loop = true; menuAudio.volume = 0.6;
menuAudio.addEventListener("canplay", () => { if (!menuOwn) { menuOwn = true; if (inMenu) music("menu"); } });
if (location.protocol.startsWith("http") && ARC.music) menuAudio.src = "/arcade/menu-music";
function ownMenu(on) {
  inMenu = on;
  if (on && menuOwn && sound) menuAudio.play().catch(() => {});
  else menuAudio.pause();
}
let engine = null;
function engineSet(on, rpm = 4000, thr = 0) {
  if (!AC) return;
  if (on && sound && !engine) {
    const mk = (type) => { const o = AC.createOscillator(); o.type = type; return o; };
    const o = mk("sawtooth"), sub = mk("square"), hi = mk("sawtooth"), lfo = mk("sine"), lfoG = AC.createGain();
    const clip = AC.createWaveShaper(), curve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 3.2); }
    clip.curve = curve;
    const band = AC.createBiquadFilter(), low = AC.createBiquadFilter(), g = AC.createGain(), gs = AC.createGain(), gh = AC.createGain();
    band.type = "peaking"; band.frequency.value = 2400; band.Q.value = 1.2; band.gain.value = 9;
    low.type = "lowpass"; low.frequency.value = 6500; g.gain.value = 0; gs.gain.value = 0.55; gh.gain.value = 0.28;
    lfo.frequency.value = 31; lfoG.gain.value = 9; lfo.connect(lfoG); lfoG.connect(o.frequency);
    o.connect(clip); sub.connect(gs); gs.connect(clip); hi.connect(gh); gh.connect(clip);
    clip.connect(band); band.connect(low); low.connect(g); g.connect(master);
    [o, sub, hi, lfo].forEach((x) => x.start());
    engine = { o, sub, hi, lfo, g, low };
  }
  if (!engine) return;
  if (!on || !sound) { engine.g.gain.value = 0; try { [engine.o, engine.sub, engine.hi, engine.lfo].forEach((x) => x.stop()); } catch (e) {} engine = null; return; }
  const f = rpm / 15, t = AC.currentTime, k = 0.025;
  engine.o.frequency.setTargetAtTime(f, t, k); engine.sub.frequency.setTargetAtTime(f / 2, t, k); engine.hi.frequency.setTargetAtTime(f * 2, t, k);
  engine.low.frequency.setTargetAtTime(2500 + thr * 5500, t, 0.05);
  engine.g.gain.setTargetAtTime(0.018 + thr * 0.03 + Math.min(1, rpm / 18000) * 0.015, t, 0.04);
}
const SHIFT = () => { noise(0.07, 0.12, 3000); tone(90, 0.06, "square", 0.05); };
function setSound(on) {
  sound = on;
  try { localStorage.setItem("arcade-sound", on ? "on" : "off"); } catch (e) {}
  if (master) master.gain.value = on ? 0.5 : 0;
  if (!on) engineSet(false);
  ownMenu(inMenu);
  document.getElementById("snd").textContent = on ? "sound on" : "sound off";
}

function txt(s, x, y, size = 12, color = "#f2f4f8", align = "left", font = "Consolas, monospace") {
  cx.font = `bold ${size}px ${font}`; cx.fillStyle = color; cx.textAlign = align; cx.textBaseline = "alphabetic"; cx.fillText(s, x, y);
}
function rect(x, y, w, h, c) { cx.fillStyle = c; cx.fillRect(x, y, w, h); }
function circ(x, y, r, c) { cx.fillStyle = c; cx.beginPath(); cx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); cx.fill(); }
function banner(lines, sub) {
  const h = 36 + lines.length * 26 + (sub ? 22 : 0);
  cx.fillStyle = "rgba(13,16,32,.86)"; cx.fillRect(W / 2 - 150, H / 2 - h / 2, 300, h);
  cx.strokeStyle = "#7c5cff"; cx.lineWidth = 2; cx.strokeRect(W / 2 - 150, H / 2 - h / 2, 300, h);
  lines.forEach((l, i) => txt(l, W / 2, H / 2 - h / 2 + 36 + i * 26, i ? 18 : 22, i ? "#f5b83d" : "#f2f4f8", "center"));
  if (sub) txt(sub, W / 2, H / 2 + h / 2 - 14, 12, "#8a90a2", "center");
}

let best = {};
async function loadBest() { const d = await ARC.scores(); if (d) best = d; showRec(); }
async function record(game, field, value) {
  try {
    if (ARC.names && !ARC.getName()) askName();
    const d = await ARC.post(game, field, value);
    if (!d) throw new Error("not recorded");
    best = d;
  } catch (e) {
    const g = best[game] || (best[game] = {});
    g[field] = field === "lap_ms" ? Math.min(g[field] || 1e9, value) : field === "best" ? Math.max(g[field] || 0, value) : (g[field] || 0) + 1;
  }
  showRec();
}
const bestOf = (id, f = "best") => (best[id] || {})[f] || 0;
function showRec() {
  if (ARC.names) return showBoard();
  const s = best.sumo || {};
  document.getElementById("rec").textContent = GAMES.filter((g) => !["sumo", "racer2", "strike", "empire"].includes(g.id)).map((g) => `${g.name} ${bestOf(g.id)}`).join(" · ")
    + ` · SUMO ${s.p1 || 0}:${s.p2 || 0} · GP DUEL ${(best.duel || {}).p1 || 0}:${(best.duel || {}).p2 || 0}`;
}

function Blocks() {
  const C = 16, COLS = 10, ROWS = 20, OX = 160, OY = 20;
  const SH = { I: [[0, 1], [1, 1], [2, 1], [3, 1]], O: [[1, 0], [2, 0], [1, 1], [2, 1]], T: [[1, 0], [0, 1], [1, 1], [2, 1]], S: [[1, 0], [2, 0], [0, 1], [1, 1]],
               Z: [[0, 0], [1, 0], [1, 1], [2, 1]], J: [[0, 0], [0, 1], [1, 1], [2, 1]], L: [[2, 0], [0, 1], [1, 1], [2, 1]] };
  const COL = { I: "#22d3ee", O: "#f5b83d", T: "#a855f7", S: "#22c55e", Z: "#f05252", J: "#3b82f6", L: "#fb923c" };
  const g = { id: "blocks", score: 0, lines: 0, level: 1, over: false, grid: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
              bag: [], piece: null, next: null, fall: 0, das: { dir: 0, t: 0 }, flash: 0,
              help: "← → move · ↑ or X turn · ↓ faster · Space drop · Esc menu · P pause" };
  const take = () => { if (!g.bag.length) g.bag = Object.keys(SH).sort(() => Math.random() - 0.5); return g.bag.pop(); };
  const mk = (t) => ({ t, cells: SH[t].map((c) => c.slice()), x: 3, y: 0 });
  const hitAt = (cells, x, y) => cells.some(([a, b]) => { const X = a + x, Y = b + y; return X < 0 || X >= COLS || Y >= ROWS || (Y >= 0 && g.grid[Y][X]); });
  function spawn() { g.piece = mk(g.next ? g.next.t : take()); g.next = mk(take()); if (hitAt(g.piece.cells, g.piece.x, g.piece.y)) g.over = true; }
  function move(dx) { if (!hitAt(g.piece.cells, g.piece.x + dx, g.piece.y)) { g.piece.x += dx; SFX.move(); } }
  function turn() {
    const p = g.piece; if (p.t === "O") return;
    const n = p.t === "I" ? 4 : 3, nc = p.cells.map(([a, b]) => [n - 1 - b, a]);
    for (const k of [0, -1, 1, -2, 2]) if (!hitAt(nc, p.x + k, p.y)) { p.cells = nc; p.x += k; SFX.rot(); return; }
  }
  function lock() {
    g.piece.cells.forEach(([a, b]) => { if (b + g.piece.y >= 0) g.grid[b + g.piece.y][a + g.piece.x] = COL[g.piece.t]; });
    const full = g.grid.map((r, i) => r.every(Boolean) ? i : -1).filter((i) => i >= 0);
    full.forEach((i) => { g.grid.splice(i, 1); g.grid.unshift(Array(COLS).fill(null)); });
    if (full.length) { g.score += [0, 100, 300, 500, 800][full.length] * g.level; g.lines += full.length; g.level = 1 + Math.floor(g.lines / 10); g.flash = 0.25; SFX.line(); } else SFX.drop();
    spawn();
  }
  g.update = (dt) => {
    const dir = (held("ArrowRight", "KeyD") ? 1 : 0) - (held("ArrowLeft", "KeyA") ? 1 : 0);
    if (dir !== g.das.dir) { g.das.dir = dir; if (dir) { move(dir); g.das.t = 0.17; } }
    else if (dir && (g.das.t -= dt) <= 0) { move(dir); g.das.t = 0.05; }
    if (pressed("ArrowUp", "KeyX", "KeyW")) turn();
    if (pressed("Space")) { while (!hitAt(g.piece.cells, g.piece.x, g.piece.y + 1)) { g.piece.y++; g.score += 2; } lock(); return; }
    const soft = held("ArrowDown", "KeyS"), every = soft ? 0.04 : Math.max(0.06, 0.8 - (g.level - 1) * 0.07);
    g.flash = Math.max(0, g.flash - dt);
    if ((g.fall += dt) >= every) {
      g.fall = 0;
      if (!hitAt(g.piece.cells, g.piece.x, g.piece.y + 1)) { g.piece.y++; if (soft) g.score += 1; } else lock();
    }
  };
  const cell = (x, y, c, a = 1) => { cx.globalAlpha = a; rect(OX + x * C + 1, OY + y * C + 1, C - 2, C - 2, c); rect(OX + x * C + 1, OY + y * C + 1, C - 2, 3, "rgba(255,255,255,.25)"); cx.globalAlpha = 1; };
  g.draw = () => {
    rect(0, 0, W, H, "#0d1020");
    rect(OX - 4, OY - 4, COLS * C + 8, ROWS * C + 8, g.flash ? "#7c5cff" : "#26304a"); rect(OX, OY, COLS * C, ROWS * C, "#0a0d1a");
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (g.grid[y][x]) cell(x, y, g.grid[y][x]);
    if (g.piece) {

      g.piece.cells.forEach(([a, b]) => { if (g.piece.y + b >= 0) cell(a + g.piece.x, b + g.piece.y, COL[g.piece.t]); });
    }
    txt("NEXT", 350, 40, 13, "#8a90a2");
    if (g.next) g.next.cells.forEach(([a, b]) => { rect(352 + a * 14, 52 + b * 14, 12, 12, COL[g.next.t]); });
    [["SCORE", g.score], ["LINES", g.lines], ["LEVEL", g.level], ["BEST", Math.max(bestOf("blocks"), g.score)]].forEach(([k, v], i) => {
      txt(k, 350, 130 + i * 44, 13, "#8a90a2"); txt(String(v), 350, 150 + i * 44, 18); });
    txt("BLOCKS", 24, 40, 18, "#22d3ee"); txt("clear lines,", 24, 62, 12, "#8a90a2"); txt("speed grows", 24, 78, 12, "#8a90a2"); txt("every 10", 24, 94, 12, "#8a90a2");
  };

}

function Rocks() {
  const g = { id: "rocks", score: 0, over: false, lives: 3, t: 0, spawn: 0.5, cool: 0, inv: 1.5,

function onlineName() {

}
function onMsg(m, from) {
  if (!ON) return;
  if (ON.host && from) {
    if (m.t === "st" || m.t === "fr") ON.net.send("*", Object.assign({}, m, { from }));
    else return;
  }
  if (!ON.host && m.from !== undefined) from = m.from;
  if (from === ON.me) return;
  if (m.t === "lobby") { ON.players = m.players; ON.game = m.game; drawRoom(); }
  else if (m.t === "go") startOnline(m);
  else if (m.t === "st") { if (ON.live && cur && cur.netState) cur.netState(from, m); }
  else if (m.t === "fr") {
    let img = ON.frames.get(from); if (!img) { img = new Image(); ON.frames.set(from, img); }
    if (m.img) img.src = m.img;
    ON.scores.set(from, { score: m.score || 0, over: !!m.over });
  }
}
function lobbyOut() { if (ON && ON.host) osend({ t: "lobby", players: ON.players, game: ON.game }); if (ON) drawRoom(); }

$o("oHost").onclick = () => {

  ON.net = Net.host("hub", name, {
    hello: (m) => { ON.code = m.room; drawRoom(); },
    join: (m) => { if (ON.players.length >= 4) return; ON.players.push({ id: m.id, name: m.name }); lobbyOut(); },
    leave: (m) => { ON.players = ON.players.filter((q) => q.id !== m.id); ON.frames.delete(m.id); ON.scores.delete(m.id); lobbyOut(); },
    msg: (m, from) => onMsg(m, from),
    error: (m) => { $o("oMsg").textContent = "Could not open a room: " + m.why; },
    fail: () => { $o("oMsg").textContent = "Could not reach the game server. Try again."; },

$o("oGame").onchange = () => { if (ON && ON.host) { ON.game = $o("oGame").value; lobbyOut(); } };
let roomsTimer = null;
$o("oJoin").onclick = () => {

$o("oBack").onclick = () => { clearInterval(roomsTimer); showOnline("oMain"); };
function joinOnline(room) {

  ON.net = Net.join("hub", room, ARC.getName() || "Player", {
    hello: (m) => { ON.me = m.you; ON.code = m.room; showOnline("oRoom"); },
    msg: (m) => onMsg(m, 0),
    error: (m) => { $o("oJMsg").textContent = "Could not join: " + m.why; ON = null; },
    fail: () => { $o("oJMsg").textContent = "Could not reach the game server. Try again."; ON = null; },

}
function leaveOnline() {

}
$o("oLeave").onclick = leaveOnline;
$o("oStart").onclick = () => {

  osend(m); startOnline(m);

};
function startOnline(m) {
  ON.players = m.players; ON.game = m.game; ON.live = true; ON.frames.clear(); ON.scores.clear();
  Math.random = seeded(m.seed);
  hideOnline(); engineSet(false); paused = false; overDone = false;
  if (m.game === "spa") {

const onSnap = document.createElement("canvas"); onSnap.width = 960; onSnap.height = 720;
const onSmall = document.createElement("canvas"); onSmall.width = 320; onSmall.height = 240;
setInterval(() => {
  if (!ON || !ON.live || !cur || cur.id === "spa" || ON.players.length < 2) return;

function drawSplit() {
  const n = ON.players.length, mine = ON.players.findIndex((q) => q.id === ON.me);
  onSnap.getContext("2d").drawImage(cv, 0, 0);
  rect(0, 0, W, H, "#05070d");
  const order = [ON.players[mine], ...ON.players.filter((q, i) => i !== mine)];
  order.forEach((q, i) => {
    const x = (i % 2) * W / 2, y = Math.floor(i / 2) * H / 2 + (n === 2 ? H / 4 : 0), w = W / 2, h = H / 2;
    if (q.id === ON.me) cx.drawImage(onSnap, x, y, w, h);
    else { const img = ON.frames.get(q.id); if (img && img.complete && img.naturalWidth) cx.drawImage(img, x, y, w, h); else txt("waiting for " + q.name + "...", x + w / 2, y + h / 2, 9, "#8a90a2", "center"); }
    const sc = q.id === ON.me ? { score: cur.score || 0, over: !!cur.over } : ON.scores.get(q.id) || { score: 0, over: false };
    rect(x, y, w, 13, "rgba(0,0,0,.6)"); txt(`${q.name}${q.id === ON.me ? " (you)" : ""} · ${sc.score}`, x + 4, y + 10, 8, q.id === ON.me ? "#fde047" : "#e5e7eb");
    if (sc.over && q.id !== ON.me) txt("GAME OVER", x + w / 2, y + h / 2, 12, "#f87171", "center");
  });
  rect(W / 2 - 0.5, 0, 1, H, "#26304a"); if (n > 2) rect(0, H / 2 - 0.5, W, 1, "#26304a");
  const done = cur.over && ON.players.every((q) => q.id === ON.me || (ON.scores.get(q.id) || {}).over);
  if (done) {
    const rank = ON.players.map((q) => ({ name: q.name, score: q.id === ON.me ? cur.score || 0 : (ON.scores.get(q.id) || {}).score || 0 })).sort((a, b) => b.score - a.score);
    banner([`${rank[0].name.toUpperCase()} WINS!`, rank.map((r, i) => `${i + 1}. ${r.name} ${r.score}`).join("   ")], ON.host ? "Esc: back to the room, then START for another round" : "Esc: back to the room");
  }
}

const BOARD_ROWS = [["spa", "lap_ms", "GRAND PRIX · best lap"], ["spa", "best", "GRAND PRIX · points"], ["strike", "best", "STRIKE & DEFUSE · kills in a match"],
  ["strike", "wins", "STRIKE & DEFUSE · matches won"], ["empire", "wins", "CORSICAN EMPIRE · wins"], ["city", "best", "CHAOS CITY"], ["blocks", "best", "BLOCKS"],
  ["rocks", "best", "ROCKS"], ["snake", "best", "SNAKE"], ["jump", "best", "JUMP"]];
function showBoard() {

  const me = ARC.getName(), fmt = (f, v) => f === "lap_ms" ? (v / 1000).toFixed(2) + " s" : String(v);

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
if (ARC.names) {

if (TouchPad.on) {

  st.textContent = "#screen{width:min(100%, calc((100vh - 70px) * 4 / 3));margin:0 auto;touch-action:none}body.playing #top,body.playing .help,body.playing #board{display:none}body.playing #wrap{padding:0;max-width:none}body.playing #screen{width:min(100vw, calc(100vh * 4 / 3));border-radius:0;border:0}#tpad.port::after{content:'turn your phone sideways';position:fixed;left:0;right:0;top:8px;text-align:center;color:#fbbf24;font:600 13px system-ui;pointer-events:none}";
  document.head.appendChild(st);
  const pad = document.createElement("div"); pad.id = "tpad"; document.body.appendChild(pad);
  const bt = (label, pos, size, code) => { const k = TouchPad.key(code); return TouchPad.button(label, pos, size, () => { audioStart(); k.down(); }, k.up, pad); };

  const any = [bt("A", { right: 20, bottom: 48 }, 82, "Space"), bt("B", { right: 112, bottom: 20 }, 62, "Enter")];
  const gp = [bt("GAS", { right: 18, bottom: 40 }, 96, "ArrowUp"), bt("BRAKE", { right: 124, bottom: 24 }, 74, "ArrowDown"), bt("ERS", { right: 40, bottom: 150 }, 58, "Space")];
