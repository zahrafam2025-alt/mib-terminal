  boom: () => noise(0.35, 0.18, 900), coin: () => { tone(988, 0.06, "square", 0.05); tone(1319, 0.14, "square", 0.05, 0, 0.06); },
  jump: () => tone(330, 0.16, "square", 0.05, 330), stomp: () => tone(200, 0.12, "square", 0.08, -120), eat: () => tone(1200, 0.05, "square", 0.05),

  go: () => tone(1500, 0.5, "square", 0.07), bump: () => { noise(0.12, 0.15, 600); tone(110, 0.12, "sawtooth", 0.08, -40); },
  taiko: () => { tone(70, 0.3, "sine", 0.35, -25); noise(0.08, 0.12, 400); }, oof: () => { tone(180, 0.25, "sawtooth", 0.09, -110); noise(0.15, 0.12, 700); },
  crowd: () => { for (let i = 0; i < 6; i++) noise(0.5, 0.05, rnd(900, 2400), i * 0.07); }, win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.14, "square", 0.06, 0, i * 0.11)),

  rocks: { bpm: 132, type: "sawtooth", vol: 0.025, notes: "A2 .5 A2 .5 E3 .5 A2 .5 G2 .5 G2 .5 D3 .5 G2 .5 F2 .5 F2 .5 C3 .5 F2 .5 E2 .5 E2 .5 B2 .5 E3 .5" },

function engineSet(on, rpm = 4000, thr = 0, voice = null) {

function Blocks() {

              help: "← → move · ↑ or X turn · ↓ faster · Space drop · Esc menu · P pause" };

  if (tall) { for (let i = 1; i < order.length; i++) rect(i * W / order.length - 0.5, 0, 1, H, "#26304a"); }
  else { rect(W / 2 - 0.5, 0, 1, H, "#26304a"); if (n > 2) rect(0, H / 2 - 0.5, W, 1, "#26304a"); }
  const done = cur.over && order.every((q) => scoreOf(q).over);
  if (done) {
    const rank = order.map((q) => ({ name: q.name, score: scoreOf(q).score })).sort((a, b) => b.score - a.score);
    banner([`${rank[0].name.toUpperCase()} WINS!`, rank.map((r, i) => `${i + 1}. ${r.name} ${r.score}`).join("   ")], againLine());
  }
}

function askName() {
  const n = ARC.setName(prompt("Your name for the scoreboard (up to 16 letters or digits):", ARC.getName()) || "");
  const b = document.getElementById("nameBtn"); if (b) b.textContent = n ? "name: " + n : "pick a name";
  screenEl.focus();
}
const BOARD_ROWS = [["goal", "best", "GOAL RUSH"], ["tennis", "best", "RALLY RUMBLE"], ["fight", "best", "FIGHT CLUB"], ["spa", "lap_ms", "GRAND PRIX · best lap"], ["spa", "best", "GRAND PRIX · points"], ["strike", "best", "STRIKE & DEFUSE · kills in a match"],
  ["strike", "wins", "STRIKE & DEFUSE · matches won"], ["empire", "wins", "CORSICAN EMPIRE · wins"], ["city", "best", "CHAOS CITY"], ["blocks", "best", "BLOCKS"],
  ["rocks", "best", "ROCKS"], ["snake", "best", "SNAKE"], ["jump", "best", "JUMP"]];
let boardOpen = "";
document.addEventListener("click", (e) => { const c = e.target.closest && e.target.closest("#board .bcard"); if (!c) return; boardOpen = boardOpen === c.dataset.b ? "" : c.dataset.b; showBoard(); });
function showBoard() {
  const box = document.getElementById("board"); if (!box) return;
  const me = ARC.getName(), fmt = (f, v) => f === "lap_ms" ? (v / 1000).toFixed(2) + " s" : String(v);
  const cards = BOARD_ROWS.map(([g, f, title]) => {
    const all = ((best[g] || {}).top || {})[f] || [], open = boardOpen === g + f, top = open ? all : all.slice(0, 3);
    const rows = top.length ? top.map((e, i) => `<li${e.n === me ? ' class="me"' : ""}><span>${i + 1}. ${esc(e.n)}</span><b>${fmt(f, e.v)}</b></li>`).join("") : '<li class="none">—</li>';
    return `<div class="bcard${open ? " open" : ""}" data-b="${g + f}"><div class="bt">${title.replace(/ · .*/, (m) => (f === "best" ? "" : m))}</div><ol>${rows}</ol></div>`;
  }).join("");
  box.innerHTML = `<div class="bh">TOP SCORES</div><div class="bgrid">${cards}</div>`;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
if (ARC.names) {
  const st = document.createElement("style");
  st.textContent = `#board{margin-top:12px}.bh{font:700 13px Consolas,monospace;letter-spacing:.12em;color:#fbbf24;margin-bottom:8px}.bh span{color:var(--muted);letter-spacing:0;font-weight:400;margin-left:8px}
    .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.bcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
    .bt{font:600 12px "Segoe UI",sans-serif;color:var(--muted);margin-bottom:4px}.bcard ol{list-style:none;margin:0;padding:0;font:12.5px Consolas,monospace}
    .bcard li{display:flex;justify-content:space-between;gap:8px;padding:1px 0}.bcard li.me{color:#fde047}.bcard li.none{color:var(--muted)}`;
  document.head.appendChild(st);
  const nb = document.createElement("button"); nb.id = "nameBtn"; nb.textContent = ARC.getName() ? "name: " + ARC.getName() : "pick a name"; nb.onclick = askName;
  document.getElementById("snd").before(nb);
  const bd = document.createElement("div"); bd.id = "board"; document.getElementById("wrap").appendChild(bd);
  const ttl = document.querySelector("#top b"); if (ttl) ttl.textContent = "MIB ARCADE";
  setInterval(loadBest, 60000);
}
if (TouchPad.on) {
  const st = document.createElement("style");
  st.textContent = "#screen{width:min(100%, calc((100vh - 70px) * 4 / 3));margin:0 auto;touch-action:none}body.playing #top,body.playing .help,body.playing #board{display:none}body.playing #wrap{padding:0;max-width:none}body.playing #screen{width:min(100vw, calc(100vh * 4 / 3));border-radius:0;border:0}body.playing.lpad #wrap{padding-left:calc(222px + env(safe-area-inset-left,0px)) !important;padding-right:env(safe-area-inset-right,0px) !important;box-sizing:border-box}body.playing.lpad #screen{width:min(calc(100vw - 230px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)), calc(100vh * 4 / 3));margin:0 auto}#tpad.port::after{content:'turn your phone sideways';position:fixed;left:0;right:0;top:8px;text-align:center;color:#fbbf24;font:600 13px system-ui;pointer-events:none}";
  document.head.appendChild(st);
  const pad = document.createElement("div"); pad.id = "tpad"; document.body.appendChild(pad);
  const bt = (label, pos, size, code) => { const k = TouchPad.key(code); return TouchPad.button(label, pos, size, () => { audioStart(); k.down(); }, k.up, pad); };
  const held2 = new Set(), setKeys = (want) => {
    for (const c of [...held2]) if (!want.has(c)) { held2.delete(c); TouchPad.key(c).up(); }
    for (const c of want) if (!held2.has(c)) { held2.add(c); audioStart(); TouchPad.key(c).down(); }
  };
  const stickZone = TouchPad.zone({ left: "0", top: "70px", bottom: "0", width: "34%", display: "none" });
  TouchPad.stick(stickZone, (x, y) => {
    window.TSTICK = { x, y };
    const want = new Set(), gpOnly = !!cur && cur.id === "spa";
    if (x < -0.35) want.add("ArrowLeft"); if (x > 0.35) want.add("ArrowRight");
    if (!gpOnly) { if (y < -0.45) want.add("ArrowUp"); if (y > 0.45) want.add("ArrowDown"); }
    setKeys(want);
  }, () => { window.TSTICK = null; setKeys(new Set()); });
  const any = [bt("A", { right: 20, bottom: 48 }, 82, "Space"), bt("B", { right: 112, bottom: 20 }, 62, "Enter")];
  const wpn = bt("WPN", { right: 40, bottom: 150 }, 58, "KeyE");
  const cBtn = bt("C", { right: 34, bottom: 150 }, 62, "KeyE");
  const gp = [bt("GAS", { right: 18, bottom: 40 }, 96, "ArrowUp"), bt("BRAKE", { right: 124, bottom: 24 }, 74, "ArrowDown"), bt("BOOST", { left: 22, bottom: 190 }, 70, "Space")];
  const dpad = [bt("▲", { left: 76, bottom: 122 }, 62, "ArrowUp"), bt("▼", { left: 76, bottom: 14 }, 62, "ArrowDown"),
    bt("◀", { left: 10, bottom: 68 }, 62, "ArrowLeft"), bt("▶", { left: 142, bottom: 68 }, 62, "ArrowRight")];
  const blk = [bt("A ⤓", { right: 20, bottom: 48 }, 82, "Space"), bt("B ⟳", { right: 112, bottom: 20 }, 62, "ArrowUp")];
  const esc = bt("☰", { right: 12, top: 12 }, 46, "Escape");
  const snd = TouchPad.soundButton(() => sound, (on) => { audioStart(); setSound(on); }, { right: 66, top: 12 });
  cv.addEventListener("click", () => { if (cur) TouchPad.full(); });
  const pq = []; let pqT = null;
  const pulse = (c) => { pq.push(c); if (!pqT) pqT = setInterval(() => { const n = pq.shift(); if (!n) { clearInterval(pqT); pqT = null; return; } const k = TouchPad.key(n); k.down(); setTimeout(k.up, 35); }, 60); };
  let bf = null;
  cv.addEventListener("pointerdown", (e) => {
    if (!cur || cur.id !== "blocks" || e.pointerType === "mouse") return;
    e.preventDefault(); audioStart(); bf = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t: performance.now(), moved: false, down: false };
  });
  cv.addEventListener("pointermove", (e) => {
    if (!bf || e.pointerId !== bf.id) return;
    const step = Math.max(18, cv.getBoundingClientRect().width / 16);
    while (e.clientX - bf.x > step) { pulse("ArrowRight"); bf.x += step; bf.moved = true; }
    while (bf.x - e.clientX > step) { pulse("ArrowLeft"); bf.x -= step; bf.moved = true; }
    if (e.clientY - bf.y0 > step * 1.5 && !bf.down && Math.abs(e.clientX - bf.x0) < step) { bf.down = true; bf.moved = true; TouchPad.key("ArrowDown").down(); }
  });
  const bEnd = (e) => {
    if (!bf || e.pointerId !== bf.id) return;
    const dt = performance.now() - bf.t, dy = e.clientY - bf.y0;
    if (bf.down) TouchPad.key("ArrowDown").up();
    if (dy > 60 && dt < 250) pulse("Space");
    else if (!bf.moved && dt < 300) pulse("ArrowUp");
    bf = null;
  };
  cv.addEventListener("pointerup", bEnd); cv.addEventListener("pointercancel", bEnd);
  const padTick = () => {
    const isGp = !!cur && cur.id === "spa", show = !!cur, blocks = !!cur && cur.id === "blocks", snake = !!cur && cur.id === "snake";
    stickZone.style.display = show && !blocks && !snake ? "" : "none";
    dpad.forEach((b) => { b.style.display = snake || blocks ? "" : "none"; });
    blk.forEach((b) => { b.style.display = blocks ? "" : "none"; });
    any.forEach((b, i) => { b.style.display = show && !isGp && !blocks && !snake && !(i === 1 && cur && (cur.id === "jump" || cur.id === "rocks")) ? "" : "none"; });
    gp.forEach((b) => { b.style.display = isGp ? "" : "none"; });
    wpn.style.display = cur && cur.id === "city" ? "" : "none"; cBtn.style.display = cur && (cur.id === "fight" || cur.id === "tennis") ? "" : "none";
    esc.style.display = show ? "" : "none"; snd.textContent = sound ? "🔊" : "🔇";
    pad.classList.toggle("port", innerHeight > innerWidth);
    document.body.classList.toggle("playing", show);
    document.body.classList.toggle("lpad", snake);
  };
  padTick(); setInterval(padTick, 250);
}
setSound(sound); menu(); loadBest(); requestAnimationFrame(frame);
window.arcade = { start, menu, tick, draw, get game() { return cur; }, press(code) { keys.add(code); hit.add(code); }, release(code) { keys.delete(code); },
  run(n) { for (let i = 0; i < n; i++) tick(); draw(); } };
